name: Update Demand Data

on:
  schedule:
    # Run at 2 AM UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Allow manual triggers

jobs:
  update-demand-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Update demand summary
        run: |
          python web/build_demand_data.py --out data/demand_summary.csv
        continue-on-error: false

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/demand_summary.csv || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/demand_summary.csv
          git commit -m "chore: update demand summary data [skip ci]"
          git push
