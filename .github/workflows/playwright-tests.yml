name: Playwright UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runners are the slowest leg (browser install alone cost
        # ~2m52s), so they only run outside pull requests. Pull requests use
        # ubuntu-latest only.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install UI test dependencies
        run: |
          npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # The browser bundle lives in a different directory on Windows.
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        # Playwright >= 1.65 ships a Chromium build, apt dependency list, and
        # officially-supported platform entry for ubuntu26.04-x64 (older
        # versions such as 1.58 do not). Keep ubuntu-latest in the matrix
        # rather than pinning to an older runner image.
        # CI always runs headless, so only the Chromium headless shell is
        # installed (skips the full headed browser download). --with-deps is
        # still needed for the apt libraries on Linux.
        run: |
          npx playwright install --with-deps --only-shell chromium

      - name: Run Playwright tests
        run: |
          npm run test:ui

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: warn