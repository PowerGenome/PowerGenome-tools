name: Playwright UI Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  playwright-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install UI test dependencies
        run: |
          npm ci

      - name: Install Playwright browser
        # Playwright >= 1.65 ships a Chromium build, apt dependency list, and
        # officially-supported platform entry for ubuntu26.04-x64 (older
        # versions such as 1.58 do not). Keep ubuntu-latest in the matrix
        # rather than pinning to an older runner image.
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          npm run test:ui

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: warn